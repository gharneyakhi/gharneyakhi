name: Build NetBlock APK

on:
  push:
    branches:
      - arena/01a02f96-gharneyakhi
    paths:
      - "NetBlockWidget/**"
      - ".github/workflows/build-netblock.yml"
      - "!NetBlockWidget/dist/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant wrapper
        run: chmod +x NetBlockWidget/gradlew

      - name: Unit tests
        working-directory: NetBlockWidget
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble APKs
        working-directory: NetBlockWidget
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Publish dist APK
        run: |
          set -euo pipefail
          mkdir -p NetBlockWidget/dist
          DEBUG_APK="NetBlockWidget/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="NetBlockWidget/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" NetBlockWidget/dist/NetBlock.apk
          else
            cp "$DEBUG_APK" NetBlockWidget/dist/NetBlock.apk
          fi
          cp "$DEBUG_APK" NetBlockWidget/dist/NetBlock-debug.apk
          ls -lh NetBlockWidget/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netblock-apks
          if-no-files-found: error
          path: |
            NetBlockWidget/dist/*.apk
            NetBlockWidget/app/build/outputs/apk/**/*.apk

      - name: Commit APK into the branch
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f NetBlockWidget/dist/NetBlock.apk NetBlockWidget/dist/NetBlock-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Add installable NetBlock APK"
          git push origin HEAD
