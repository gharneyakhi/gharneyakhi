  <!-- background -->
  <rect width="1712" height="1080" fill="#F8F1E0"/>
  <rect width="1712" height="14" fill="#EE9A3F"/>

  <!-- top-left decoration -->
  <g fill="#0C444D">
    <use xlink:href="#paw" transform="translate(168 196) scale(1.5) rotate(-14)" opacity="0.10"/>
    <use xlink:href="#paw" transform="translate(338 122) scale(0.95) rotate(12)" opacity="0.09"/>
    <use xlink:href="#paw" transform="translate(452 214) scale(0.6) rotate(-8)" opacity="0.07"/>
  </g>
  <circle cx="92" cy="868" r="168" fill="none" stroke="#0C444D" stroke-opacity="0.055" stroke-width="26"/>

  <!-- header: badge + name (RTL: right side) -->
  <use xlink:href="#dogBadge" transform="translate(1472 212) scale(1.5) translate(-100 -100)"/>
  <text x="1282" y="240" font-family="Vazirmatn" font-weight="900" font-size="100" fill="#0C444D" text-anchor="start" direction="rtl">میولند</text>
  <text x="1282" y="324" font-family="Vazirmatn" font-weight="700" font-size="42" fill="#D97624" text-anchor="start" direction="rtl" letter-spacing="3">پت شاپ</text>

  <!-- divider -->
  <line x1="130" y1="424" x2="1282" y2="424" stroke="#0C444D" stroke-opacity="0.14" stroke-width="2.5"/>
  <line x1="1102" y1="424" x2="1282" y2="424" stroke="#EE9A3F" stroke-width="5" stroke-linecap="round"/>

  <!-- contact rows (RTL, right-aligned) -->
  <g>
    <!-- address -->
    <circle cx="1522" cy="572" r="42" fill="#0C444D"/>
    <use xlink:href="#icPin" transform="translate(1489.6 539.6) scale(2.7)"/>
    <text x="1448" y="545" font-family="Vazirmatn" font-weight="700" font-size="34" fill="#D97624" text-anchor="start" direction="rtl">آدرس</text>
    <text x="1448" y="606" font-family="Vazirmatn" font-weight="500" font-size="47" fill="#1A3E45" text-anchor="start" direction="rtl">شهریار، خیابان ولیعصر، نبش کوچه احمد</text>

    <!-- phone -->
    <circle cx="1522" cy="713" r="42" fill="#0C444D"/>
    <use xlink:href="#icPhone" transform="translate(1489.6 680.6) scale(2.7)"/>
    <text x="1448" y="686" font-family="Vazirmatn" font-weight="700" font-size="34" fill="#D97624" text-anchor="start" direction="rtl">تلفن</text>
    <text x="1448" y="747" font-family="Vazirmatn" font-weight="600" font-size="47" fill="#1A3E45" text-anchor="end" direction="ltr">0910 933 9859</text>

    <!-- instagram -->
    <circle cx="1522" cy="854" r="42" fill="#0C444D"/>
    <use xlink:href="#icInsta" transform="translate(1489.6 821.6) scale(2.7)"/>
    <text x="1448" y="827" font-family="Vazirmatn" font-weight="700" font-size="34" fill="#D97624" text-anchor="start" direction="rtl">اینستاگرام</text>
    <text x="1448" y="888" font-family="Vazirmatn" font-weight="600" font-size="47" fill="#1A3E45" text-anchor="end" direction="ltr">@miyoland</text>
  </g>

  <!-- bottom strip -->
  <rect y="942" width="1712" height="138" fill="#0C444D"/>
  <use xlink:href="#paw" transform="translate(520 1011) scale(1.0)" fill="#EE9A3F" opacity="0.9"/>
  <use xlink:href="#paw" transform="translate(1192 1011) scale(1.0)" fill="#EE9A3F" opacity="0.9"/>
  <text x="856" y="1026" font-family="Vazirmatn" font-weight="500" font-size="37" fill="#FBF3E2" fill-opacity="0.85" text-anchor="middle" direction="rtl">لبخندِ کوچک‌ترین اعضای خانواده</text>
</svg>
