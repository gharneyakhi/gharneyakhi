      <path d="M100 117 C 108 117 113 121.5 113 127 C 113 133.5 105.5 138.5 100 138.5 C 94.5 138.5 87 133.5 87 127 C 87 121.5 92 117 100 117 Z" fill="#0B3A41"/>
      <path d="M100 138.5 C 100 145 95.5 149 89.5 148 M100 138.5 C 100 145 104.5 149 110.5 148" stroke="#0B3A41" stroke-width="3.4" fill="none" stroke-linecap="round"/>
