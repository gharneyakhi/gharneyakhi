      <path d="M143 47 C 167 28, 190 42, 185 74 C 181 97, 163 108, 149 97 C 143 92, 140 80, 139 68 Z" fill="#E07F2A"/>
      <path d="M100 46 C 136 46 159 70 159 102 C 159 139 133 164 100 164 C 67 164 41 139 41 102 C 41 70 64 46 100 46 Z" fill="#0E4A52"/>
