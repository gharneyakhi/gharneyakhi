      <circle cx="100" cy="166" r="9" fill="#F6C37E" stroke="#0B3A41" stroke-width="2.6"/>
      <circle cx="100" cy="162.5" r="2" fill="#0B3A41"/>
    </g>
    <g id="icPin" fill="none" stroke="#FBF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </g>
    <g id="icPhone" fill="none" stroke="#FBF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
